name: Linter

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
      contents: read

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f ${{ github.workspace }}/src/backend/requirements.txt ]; then pip install -r ${{ github.workspace }}/src/backend/requirements.txt; fi
        pip install pylint
    - name: Analysing backend with pylint
      run: |
        pylint --rcfile=${{ github.workspace }}/.github/workflows/.pylintrc $(git ls-files 'src/backend/*.py')
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '>=24.7.0'

      - name: Lint and Tidy Dashboard
        working-directory: ./src/dashboard
        run: |
          npm install
          npm run lint
  lint-golang:
    name: Lint Golang code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
