services:
  telemetry-receiver:
    user: "1000:1000"
    container_name: Telemetry-Receiver
    build:
      context: .
      dockerfile: src/udp-server/Dockerfile
    environment:
      - PORT=${UDP_PORT}
      - KAFKA_ADDRESS=${KAFKA_ADDRESS}
      - KAFKA_PORT=${KAFKA_PORT}
    ports:
      - "${UDP_PORT}:${UDP_PORT}/udp"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy

  kafka:
    image: bitnami/kafka:latest
    container_name: Kafka
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    volumes:
      - kafka_data:/bitnami/kafka
    environment:
      # KRaft settings
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:${KAFKA_CONTROLLER_PORT}

      # Listeners
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:${KAFKA_PORT},CONTROLLER://:${KAFKA_CONTROLLER_PORT}
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://${KAFKA_ADDRESS}:${KAFKA_PORT}
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      # Topic settings
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_NUM_PARTITIONS=1
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:${KAFKA_PORT} --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
  
  dashboard:
    container_name: Dashboard
    build:
      context: src/dashboard/
      dockerfile: Dockerfile
    environment:
      - DASHBOARD_PORT=${DASHBOARD_PORT}
      - BACKEND_PORT=${BACKEND_PORT}
    ports:
      - "${DASHBOARD_PORT}:${DASHBOARD_PORT}"
    restart: unless-stopped

  backend:
    container_name: Backend
    build:
      context: src/backend
      dockerfile: Dockerfile
    environment:
      - KAFKA_ADDRESS=${KAFKA_ADDRESS}
      - KAFKA_PORT=${KAFKA_PORT}
      - BACKEND_PORT=${BACKEND_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      kafka:
        condition: service_healthy
  
  database:
    container_name: Database
    image: redis:alpine
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
  
  db-manager:
    container_name: DB-Manager
    build:
      context: .
      dockerfile: src/database/Dockerfile
    environment:
      - KAFKA_ADDRESS=${KAFKA_ADDRESS}
      - KAFKA_PORT=${KAFKA_PORT}
      - REDIS_ADDRESS=${REDIS_ADDRESS}
      - REDIS_PORT=${REDIS_PORT}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  kafka_data:
    driver: local